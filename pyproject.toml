[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cali-pso", email = "raphael.poggi@laposte.net" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "flask>=3.1.3",
    "mypy>=2.4.0",
    "openvino-genai>=2026.4.1.0",
    "pydantic>=2.13.4",
    "sentence-transformers[openvino]",
    "torch",
    "tqdm>=4.66.5",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
compile-bytecode = true

[tool.mypy]
# `mypy .` from the repository root: same exclusions as setup.cfg.
exclude = ["^\\.venv/", "^data/"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Libraries shipped without type information.
module = [
    "fire",
    "openvino",
    "openvino_genai",
    "openvino_tokenizers",
    "optimum.*",
    "tokenizers",
    "tqdm",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers' from_pretrained() is untyped (--strict only).
module = "src.oracle"
disallow_untyped_calls = false
